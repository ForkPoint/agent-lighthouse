version: 2
updates:
  # GitHub Actions workflows and composite action dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # pnpm monorepo dependencies (root workspace and packages/*)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    # Keep major upgrades in groups with separate migration and validation needs.
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      release-tooling-major:
        patterns:
          - "@changesets/*"
        update-types:
          - "major"
      test-and-compiler-major:
        patterns:
          - "typescript"
          - "@typescript/*"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
        update-types:
          - "major"
      runtime-major:
        patterns:
          - "domhandler"
          - "@types/domhandler"
          - "jsdom"
          - "@types/jsdom"
          - "undici"
          - "zod"
        update-types:
          - "major"
    ignore:
      # Match the Node 22 CI runtime; revisit this with a runtime upgrade.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Pinned via package.json / pnpm overrides
      - dependency-name: "encoding-sniffer"
      - dependency-name: "glob"
