name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write
  # Dispatches CI on the release pull request (see the last step).
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'ci(release): version packages'
          commit-message: 'ci(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # GitHub starts no workflow run for a pull request opened or updated with
      # GITHUB_TOKEN, so CI never checked the release PR before it published.
      # workflow_dispatch is one of the two events that token may still
      # trigger; the run checks the release branch's head commit, and its
      # checks show on the pull request.
      - name: Run CI on the release pull request
        if: steps.changesets.outputs['pr-number'] != ''
        run: gh workflow run ci.yml --ref "changeset-release/${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
