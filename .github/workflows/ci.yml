name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow dispatches this on the changeset release branch: a
  # pull request opened with GITHUB_TOKEN triggers no pull_request run.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # Type-aware lint reads core's types from its built dist, as the
      # cli, mcp and report packages resolve it, so it runs after the build.
      - name: Lint
        run: pnpm lint

      - name: Check published type declarations
        run: pnpm check:package-types

      # The CLI and the MCP bin load core's CommonJS bundle; unit tests run
      # the sources. This compares the two bundles audit by audit.
      - name: Check core's CJS and ESM bundles agree
        run: pnpm check:bundle-parity

      - name: Smoke-test the installed packages
        run: pnpm smoke:packages

      - name: Check audit-dossier linkage
        run: pnpm check:dossiers

      - name: Check audits make no direct network calls
        run: pnpm check:audit-boundaries

      - name: Check audit-evidence requirements
        run: pnpm check:requires

      - name: Check audit map agreement
        run: pnpm check:audit-map

      - name: Check enum constants replace magic strings
        run: pnpm check:enums

      - name: Check for unused files, exports and dependencies
        run: pnpm knip

      - name: Check docs for retired page type names
        run: pnpm check:retired-names

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The nightly corpus job runs on a schedule, so nothing else in CI ever
      # loads its script — and `scripts/` is outside every package tsconfig, so
      # `pnpm typecheck` does not read it either. `--limit=0` is the wiring
      # path: it parses flags, reads the site list, builds the window and writes
      # an empty summary, and it makes no network request. It costs a few
      # seconds and it means the first execution of that file is not the merge.
      - name: Smoke-test the corpus nightly script
        run: node --import tsx scripts/scan-site-list.ts --limit=0

      - name: Smoke-test the live test runner
        run: pnpm test:live --limit=0
