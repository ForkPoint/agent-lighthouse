ath{fill:#f6f7fb;stroke:#4f46e5;stroke-width:1px;}#my-svg .rough-node .label text,#my-svg .node .label text,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .rough-node .label,#my-svg .node .label,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-align:center;}#my-svg .node.clickable{cursor:pointer;}#my-svg .root .anchor path{fill:#526078!important;stroke-width:0;stroke:#526078;}#my-svg .arrowheadPath{fill:#000000;}#my-svg .edgePaths .path{stroke:#526078;stroke-width:1px;}#my-svg .flowchart-link{stroke:#526078;fill:none;}#my-svg .edgeLabel{background-color:hsl(108, 38.4615384615%, 97.4509803922%);text-align:center;}#my-svg .edgeLabel p{background-color:hsl(108, 38.4615384615%, 97.4509803922%);}#my-svg .edgeLabel rect{opacity:0.5;background-color:hsl(108, 38.4615384615%, 97.4509803922%);fill:hsl(108, 38.4615384615%, 97.4509803922%);}#my-svg .labelBkg{background-color:rgba(247.0000000001, 251.0000000001, 246.0000000002, 0.5);}#my-svg .cluster rect{fill:hsl(48, 38.4615384615%, 100%);stroke:hsl(48, 0%, 90%);stroke-width:1px;}#my-svg .cluster text{fill:#000000;}#my-svg .cluster span{color:#000000;}#my-svg .node .collapsed-indicator{fill:hsl(48, 0%, 90%);stroke:none;opacity:0.6;}#my-svg .node .collapsed-separator{stroke:hsl(48, 0%, 90%);stroke-width:0.75px;}#my-svg div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial,sans-serif;font-size:12px;background:hsl(48, 38.4615384615%, 100%);border:1px solid hsl(48, 0%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#my-svg .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#101828;}#my-svg rect.text{fill:none;stroke-width:0;}#my-svg .icon-shape,#my-svg .image-shape{background-color:hsl(108, 38.4615384615%, 97.4509803922%);text-align:center;}#my-svg .icon-shape p,#my-svg .image-shape p{background-color:hsl(108, 38.4615384615%, 97.4509803922%);padding:2px;}#my