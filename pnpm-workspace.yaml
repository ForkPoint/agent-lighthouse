packages:
  - 'packages/*'

# pnpm 10 blocks dependency install scripts unless explicitly allowed.
onlyBuiltDependencies:
  - esbuild

# Security overrides for vulnerable transitive dependencies (PR #128).
# pnpm 10.34 reads overrides here; it ignores the package.json `pnpm` field.
overrides:
  "encoding-sniffer": "1.0.2"
  "launch-editor@<2.14.2": "2.14.2"
  "glob": "12.0.0"
  "undici@>=7.0.0 <7.30.1": "7.30.1"
  "ip-address@<10.7.4": "10.7.4"
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
  "hono@<4.13.11": "4.13.11"
  "devalue@<5.9.3": "5.9.3"
  "proxy-addr@<2.0.8": "2.0.8"
  "qs@<6.16.0": "6.16.0"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "smol-toml@<1.9.0": "1.9.0"
  "source-map-js@<1.2.2": "1.2.2"
